name: Stable CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  stable-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.12.18'
          python-version: '3.12'
          enable-cache: false
      - name: Install test runtime
        run: uv sync --extra dev
      - name: Run full test suite
        run: .venv/bin/python -m pytest -q
      - name: Verify report HTTP boundaries with synthetic data
        run: PYTHONPATH=src:. .venv/bin/python tests/e2e_doc_report.py --evidence report-evidence.json
      - name: Build wheel
        run: uv build
      - name: Lint client
        run: uvx ruff check src/linkedin_mdp_mcp/client.py
      - name: Typecheck client
        run: uvx mypy src/linkedin_mdp_mcp/client.py
