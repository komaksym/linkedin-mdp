name: Live LinkedIn E2E

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/e2e.yml'
      - 'pyproject.toml'
      - 'src/**'
      - 'tests/e2e_live.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.ORION_TOKEN }}
      LINKEDIN_API_VERSION: ${{ vars.LINKEDIN_API_VERSION || '202312' }}
      MCP_HOST: 127.0.0.1
      MCP_PORT: '8000'

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Direct LinkedIn auth diagnostic
        shell: bash
        run: |
          python - <<'PY'
          import os
          t = os.environ["LINKEDIN_ACCESS_TOKEN"]
          print("token_nonempty=", bool(t))
          print("token_length=", len(t))
          print("starts_with_bearer=", t.lower().startswith("bearer "))
          print("has_outer_quotes=", len(t) >= 2 and t[0] == t[-1] and t[0] in "'\"")
          print("contains_newline=", "\n" in t or "\r" in t)
          PY

          code="$(curl -sS -o linkedin_direct.json -w '%{http_code}' \
            'https://api.linkedin.com/rest/memberSnapshotData?q=criteria&domain=CONNECTIONS&start=0&count=1' \
            -H "Authorization: Bearer $LINKEDIN_ACCESS_TOKEN" \
            -H "Linkedin-Version: $LINKEDIN_API_VERSION" \
            -H 'Content-Type: application/json')"
          echo "direct_linkedin_http_status=$code"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            cat linkedin_direct.json
            echo
            exit 3
          fi

      - name: Extract CONNECTIONS schema only
        shell: bash
        run: |
          python - <<'PY'
          import json

          with open("linkedin_direct.json", encoding="utf-8") as f:
              payload = json.load(f)

          rows = []
          for element in payload.get("elements", []):
              if isinstance(element, dict):
                  data = element.get("snapshotData")
                  if isinstance(data, list):
                      rows.extend(data)

          first = rows[0] if rows and isinstance(rows[0], dict) else {}
          schema = {
              "row_count_in_probe": len(rows),
              "row_keys": sorted(first),
              "row_types": {key: type(first[key]).__name__ for key in sorted(first)},
          }
          with open("connection-schema.json", "w", encoding="utf-8") as f:
              json.dump(schema, f, indent=2, sort_keys=True)
          print("connection_schema_keys=", schema["row_keys"])
          PY

      - name: Upload CONNECTIONS schema
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-connections-schema
          path: connection-schema.json
          retention-days: 1
          if-no-files-found: error

      - name: Install
        run: uv sync --extra dev

      - name: Start MCP server
        shell: bash
        run: |
          uv run linkedin-mdp-mcp >server.log 2>&1 &
          echo $! > server.pid
          for i in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/8000) 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Run live MCP to LinkedIn E2E
        run: uv run python tests/e2e_live.py

      - name: Server log on failure
        if: failure()
        run: cat server.log || true
