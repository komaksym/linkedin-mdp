name: Live LinkedIn E2E

on:
  push:
    branches: [main, feature/connections-supabase-reconciliation]
    paths:
      - '.github/workflows/e2e.yml'
      - 'pyproject.toml'
      - 'src/**'
      - 'tests/e2e_live.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.ORION_TOKEN }}
      LINKEDIN_API_VERSION: ${{ vars.LINKEDIN_API_VERSION || '202312' }}
      MCP_HOST: 127.0.0.1
      MCP_PORT: '8000'

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Direct LinkedIn auth diagnostic
        shell: bash
        run: |
          python - <<'PY'
          import os
          t = os.environ["LINKEDIN_ACCESS_TOKEN"]
          print("token_nonempty=", bool(t))
          print("token_length=", len(t))
          print("starts_with_bearer=", t.lower().startswith("bearer "))
          print("has_outer_quotes=", len(t) >= 2 and t[0] == t[-1] and t[0] in "'\"")
          print("contains_newline=", "\n" in t or "\r" in t)
          PY

          code="$(curl -sS -o linkedin_direct.json -w '%{http_code}'             'https://api.linkedin.com/rest/memberSnapshotData?q=criteria&domain=CONNECTIONS&start=0&count=1'             -H "Authorization: Bearer $LINKEDIN_ACCESS_TOKEN"             -H "Linkedin-Version: $LINKEDIN_API_VERSION"             -H 'Content-Type: application/json')"
          echo "direct_linkedin_http_status=$code"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            cat linkedin_direct.json
            echo
            exit 3
          fi

      - name: Install
        run: uv sync --extra dev

      - name: Print recent MDP connections
        shell: bash
        run: |
          uv run python - <<'PY'
          import asyncio
          import json
          from datetime import datetime, date
          from linkedin_mdp_mcp.client import LinkedInMDPClient

          def parse_date(value):
              if not isinstance(value, str):
                  return None
              value = value.strip()
              for fmt in ("%d %b %Y", "%Y-%m-%d"):
                  try:
                      return datetime.strptime(value, fmt).date()
                  except ValueError:
                      pass
              return None

          async def main():
              client = LinkedInMDPClient.from_env()
              try:
                  snapshot = await client.snapshot("CONNECTIONS", max_pages=50)
              finally:
                  await client.aclose()

              seen = set()
              recent = []
              for row in snapshot.get("rows", []):
                  if not isinstance(row, dict):
                      continue
                  connected = parse_date(row.get("Connected On"))
                  if connected is None or not (date(2026, 9, 21) <= connected <= date(2026, 9, 29)):
                      continue
                  key = row.get("URL") or (row.get("First Name"), row.get("Last Name"), row.get("Company"), row.get("Connected On"))
                  if key in seen:
                      continue
                  seen.add(key)
                  recent.append({
                      "First Name": row.get("First Name"),
                      "Last Name": row.get("Last Name"),
                      "Company": row.get("Company"),
                      "Position": row.get("Position"),
                      "URL": row.get("URL"),
                      "Connected On": row.get("Connected On"),
                  })

              recent.sort(key=lambda x: ((parse_date(x.get("Connected On")) or date.min), x.get("Last Name") or "", x.get("First Name") or ""), reverse=True)
              print("RECENT_CONNECTIONS=" + json.dumps(recent, ensure_ascii=False, sort_keys=True))
              print("RECENT_CONNECTIONS_COUNT=" + str(len(recent)))

          asyncio.run(main())
          PY

      - name: Start MCP server
        shell: bash
        run: |
          uv run linkedin-mdp-mcp >server.log 2>&1 &
          echo $! > server.pid
          for i in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/8000) 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Run live MCP to LinkedIn E2E
        run: uv run python tests/e2e_live.py

      - name: Server log on failure
        if: failure()
        run: cat server.log || true
