name: One-time inbox evidence validation

on:
  push:
    branches: [validation/inbox-evidence-20261001]
    paths: [.github/workflows/inbox-evidence-validation.yml]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: connections-reconciliation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 64d64ea76db9a368399e59fc9a1ced7cc1cf570c
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.12.18'
          python-version: '3.12'
          enable-cache: false
      - name: Install runtime
        run: uv sync --no-dev
      - name: Verify real inbox persistence and replay
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.ORION_TOKEN }}
          LINKEDIN_API_VERSION: ${{ vars.LINKEDIN_API_VERSION || '202312' }}
          SUPABASE_URL: https://mvgzdcqhdruhjoexbdqp.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=src .venv/bin/python - <<'PY'
          import asyncio
          import diagnostics.verify_inbox_live as live
          from linkedin_mdp_mcp.inbox_sync import normalize_profile_url
          class DiagnosticComplete(Exception):
              pass
          original = live.reconcile_inbox
          original_keys = live.SupabaseClient.prospect_ids_by_linkedin_key
          async def keys(self):
              result = await original_keys(self)
              print("[inbox-check] database keys present:", bool(result))
              print("[inbox-check] supported full URL keys present:", any(normalize_profile_url(key) for key in result))
              print("[inbox-check] hostless canonical keys present:", any(key.startswith("linkedin.com/in/") for key in result))
              return result
          async def reconcile(*args, **kwargs):
              kwargs["dry_run"] = True
              result = await original(*args, **kwargs)
              print("[inbox-check] inbox rows present:", result.fetched_rows > 0)
              print("[inbox-check] planned events present:", result.planned_events > 0)
              for reason in ("withheld_thread", "malformed_participants", "self_or_ambiguous_direction", "unknown_prospect", "empty_content", "malformed_timestamp"):
                  print("[inbox-check] skipped " + reason + ":", result.skip_reasons.get(reason, 0) > 0)
              raise DiagnosticComplete()
          live.SupabaseClient.prospect_ids_by_linkedin_key = keys
          live.reconcile_inbox = reconcile
          try:
              asyncio.run(live.verify())
          except DiagnosticComplete:
              print("[inbox-check] read-only diagnosis complete")
          PY
