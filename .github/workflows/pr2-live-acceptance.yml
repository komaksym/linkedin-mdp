name: PR 2 targeted regression

on:
  push:
    branches:
      - feature/connections-supabase-reconciliation

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.12.18'
          python-version: '3.12'

      - name: Install test runtime
        run: uv sync --extra dev

      - name: Run connection reconciliation tests
        run: uv run pytest tests/test_connection_sync.py -q
