name: PR 2 pagination diagnostic

on:
  push:
    branches:
      - feature/connections-supabase-reconciliation

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.ORION_TOKEN }}
      LINKEDIN_API_VERSION: ${{ vars.LINKEDIN_API_VERSION || '202312' }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.12.18'
          python-version: '3.12'

      - name: Install production runtime
        run: uv sync

      - name: Inspect paged CONNECTIONS metadata
        run: |
          PYTHONPATH=src .venv/bin/python - <<'PY'
          import asyncio
          import json

          from linkedin_mdp_mcp.client import LinkedInAPIError, LinkedInMDPClient

          async def main() -> None:
              client = LinkedInMDPClient.from_env()
              try:
                  url = client._make_url("/rest/memberSnapshotData")
                  query = {"q": "criteria", "domain": "CONNECTIONS"}

                  for page_number in range(1, 6):
                      try:
                          payload = await client._get_json_url(url, query)
                      except LinkedInAPIError as exc:
                          print(json.dumps({
                              "page": page_number,
                              "result": "api_error",
                              "http_status": exc.status_code,
                              "service_error_code": exc.service_error_code,
                          }, sort_keys=True))
                          return

                      elements = payload.get("elements")
                      paging = payload.get("paging")
                      row_count = 0
                      if isinstance(elements, list):
                          row_count = sum(
                              len(element.get("snapshotData"))
                              for element in elements
                              if isinstance(element, dict)
                              and isinstance(element.get("snapshotData"), list)
                          )

                      next_url = client._next_link(payload)
                      print(json.dumps({
                          "page": page_number,
                          "result": "success",
                          "elements_count": len(elements) if isinstance(elements, list) else None,
                          "rows": row_count,
                          "paging_start": paging.get("start") if isinstance(paging, dict) else None,
                          "paging_count": paging.get("count") if isinstance(paging, dict) else None,
                          "paging_total": paging.get("total") if isinstance(paging, dict) else None,
                          "has_next": next_url is not None,
                      }, sort_keys=True))

                      if next_url is None:
                          return
                      url = next_url
                      query = None
              finally:
                  await client.aclose()

          asyncio.run(main())
          PY
