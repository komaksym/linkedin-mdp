name: PR 2 verification

on:
  push:
    branches:
      - feature/connections-supabase-reconciliation
    paths:
      - '.github/workflows/pr2-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.12.18'
          python-version: '3.12'

      - name: Install production runtime
        run: uv sync

      - name: Verify production imports
        run: PYTHONPATH=src .venv/bin/python -c "import httpx, mcp, pydantic; import linkedin_mdp_mcp.connection_sync, linkedin_mdp_mcp.supabase_client"

      - name: Install test runtime
        run: uv sync --extra dev

      - name: Compile
        run: uv run python -m compileall -q src scripts

      - name: Test
        run: uv run pytest -q

      - name: Build
        run: uv build
