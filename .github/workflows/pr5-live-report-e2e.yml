name: PR 5 one-time live report E2E

on:
  push:
    branches:
      - validation/pr5-live-report-20261001
    paths:
      - '.github/workflows/pr5-live-report-e2e.yml'

permissions:
  contents: read

jobs:
  report:
    if: github.ref == 'refs/heads/validation/pr5-live-report-20261001'
    concurrency:
      group: connections-reconciliation
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: caa951c5421dad1790576c6fa1ce0b4fa37889d9
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.12.18'
          python-version: '3.12'
          enable-cache: false

      - name: Install reporting runtime
        run: uv sync --no-dev

      - name: Update private Google Doc
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.ORION_TOKEN }}
          LINKEDIN_API_VERSION: ${{ vars.LINKEDIN_API_VERSION || '202312' }}
          SUPABASE_URL: https://mvgzdcqhdruhjoexbdqp.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_REPORT_DOCUMENT_ID: ${{ secrets.GOOGLE_REPORT_DOCUMENT_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: |
          PYTHONPATH=src:. .venv/bin/python - <<'PY'
          """Run the exact reporter and verify private publication without exposing report data."""
          
          import asyncio
          import sys
          
          from linkedin_mdp_mcp.google_doc_report import GoogleDocPublisher, render_report
          from scripts import report_connections_doc as cli
          
          
          def document_text(value):
              """Extract native Docs text runs in order without persisting private content."""
              if isinstance(value, list):
                  return "".join(document_text(item) for item in value)
              if not isinstance(value, dict):
                  return ""
              if "textRun" in value:
                  return value["textRun"].get("content", "")
              return "".join(document_text(item) for item in value.values())
          
          
          def sections(document):
              """Split the single managed report region and surrounding operator notes."""
              text = document_text(document.get("tabs") or document.get("body"))
              before, region = text.split("[BEGIN AUTOMATED REPORT]\n", 1)
              report, after = region.split("[END AUTOMATED REPORT]", 1)
              return before, report, after
          
          
          class VerifiedPublisher(GoogleDocPublisher):
              """Use the real publisher and compare its generated report to private readback."""
          
              verified = False
          
              async def publish(self, result):
                  """Require exact status/count text, preserved notes, and a new private revision."""
                  token = await self._access_token()
                  before = await self._preflight_and_read(token)
                  await super().publish(result)
                  after = await self._preflight_and_read(token)
                  old_prefix, _, old_suffix = sections(before)
                  prefix, actual, suffix = sections(after)
                  if actual != render_report(result) or (prefix, suffix) != (old_prefix, old_suffix):
                      raise RuntimeError("report verification unavailable")
                  if before["revisionId"] == after["revisionId"]:
                      raise RuntimeError("report verification unavailable")
                  VerifiedPublisher.verified = result.status == "COMPLETE"
          
          
          async def main():
              """Exit successfully only after real reconciliation and exact private readback."""
              cli.GoogleDocPublisher = VerifiedPublisher
              code = await cli.run()
              if code == 0 and VerifiedPublisher.verified:
                  print("live report e2e: status, counts, notes and private access verified")
                  return 0
              print("live report e2e: complete publication not verified", file=sys.stderr)
              return code or 1
          
          
          if __name__ == "__main__":
              try:
                  code = asyncio.run(main())
              except Exception:
                  print("live report e2e: verification unavailable", file=sys.stderr)
                  code = 2
              raise SystemExit(code)
          
          PY
