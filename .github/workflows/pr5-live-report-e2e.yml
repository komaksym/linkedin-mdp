name: PR 5 one-time live report E2E

on:
  push:
    branches:
      - validation/pr5-live-report-20261001
    paths:
      - '.github/workflows/pr5-live-report-e2e.yml'

permissions:
  contents: read

jobs:
  report:
    if: github.ref == 'refs/heads/validation/pr5-live-report-20261001'
    concurrency:
      group: connections-reconciliation
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 041be40f5141d9cfe1a9851945a337c09a9ebe01
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.12.18'
          python-version: '3.12'
          enable-cache: false

      - name: Install reporting runtime
        run: uv sync --no-dev

      - name: Trace pagination without database or document writes
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.ORION_TOKEN }}
          LINKEDIN_API_VERSION: ${{ vars.LINKEDIN_API_VERSION || '202312' }}
        run: |
          PYTHONPATH=src .venv/bin/python - <<'PY'
          """Trace the real snapshot failure while exposing only technical request flags."""
          
          import asyncio
          import json
          from urllib.parse import parse_qs, urlparse
          
          from linkedin_mdp_mcp.client import LinkedInAPIError, LinkedInMDPClient
          
          
          class TraceClient(LinkedInMDPClient):
              """Record HTTP outcomes without changing the real pagination algorithm."""
          
              records = None
          
              async def _get_json_url(self, url, params):
                  """Run the original request and emit an allowlisted boundary record."""
                  query = parse_qs(urlparse(url).query) if params is None else params
                  def value(key):
                      """Normalize one known query parameter without printing unknown values."""
                      item = query.get(key)
                      return item[0] if isinstance(item, list) and item else item
                  path = urlparse(url).path
                  record = {
                      "request_index": len(self.records) + 1,
                      "rest_snapshot_route": path == "/rest/memberSnapshotData",
                      "v2_snapshot_route": path == "/v2/memberSnapshotData",
                      "finder_criteria": value("q") == "criteria",
                      "connections_domain": value("domain") == "CONNECTIONS",
                      "start": int(value("start")) if str(value("start")).isdigit() else None,
                      "count": int(value("count")) if str(value("count")).isdigit() else None,
                  }
                  try:
                      payload = await super()._get_json_url(url, params)
                  except LinkedInAPIError as error:
                      record["http_status"] = error.status_code
                      record["known_no_data_message"] = "No data found for this domain and memberId" in str(error)
                      record["exact_known_no_data_message"] = str(error) in {
                          "LinkedIn API error 404: No data found for this domain and memberId.",
                          "LinkedIn API error 404: No data found for this memberId.",
                          "LinkedIn API error 404: No data found for this domain and memberId",
                          "LinkedIn API error 404: No data found for this memberId",
                      }
                      self.records.append(record)
                      print("pagination trace: " + json.dumps(record, sort_keys=True))
                      raise
                  record["http_status"] = 200
                  paging = payload.get("paging", {})
                  next_url = self._next_link(payload)
                  record["has_next"] = next_url is not None
                  record["paging_start"] = paging.get("start") if isinstance(paging.get("start"), int) else None
                  record["paging_count"] = paging.get("count") if isinstance(paging.get("count"), int) else None
                  self.records.append(record)
                  print("pagination trace: " + json.dumps(record, sort_keys=True))
                  return payload
          
          
          async def main():
              """Reproduce the exact failure with the unchanged production client."""
              client = TraceClient.from_env()
              client.records = []
              try:
                  await client.snapshot("CONNECTIONS")
                  print("pagination verdict: failure not reproduced")
              except LinkedInAPIError as error:
                  reproduced = error.status_code == 404 and len(client.records) > 1 and client.records[0]["http_status"] == 200
                  print("pagination verdict: reproduced later-page HTTP 404" if reproduced else "pagination verdict: different failure")
              except Exception:
                  print("pagination verdict: diagnostic unavailable")
              finally:
                  await client.aclose()
          
          
          if __name__ == "__main__":
              asyncio.run(main())
          
          PY
