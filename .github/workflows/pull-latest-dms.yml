name: Pull Latest LinkedIn DMs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pull-latest-dms.yml'
      - 'scripts/pull_latest_dms.py'
      - 'src/**'
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  pull-dms:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.ORION_TOKEN }}
      LINKEDIN_API_VERSION: ${{ vars.LINKEDIN_API_VERSION || '202312' }}
      MCP_HOST: 127.0.0.1
      MCP_PORT: '8000'
      DM_PUBLIC_KEY_PATH: /tmp/dm-public.pem
      DM_OUTPUT_DIR: dm-artifact

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Install
        run: uv sync --extra dev

      - name: Write one-time public key
        shell: bash
        run: |
          cat > "$DM_PUBLIC_KEY_PATH" <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAuHHo1pZOmY8P4YyeQ/0L
          6tcqm3K0qjvJe17qtFqLGTRPhQuEA40Og7MELwkRx2h/g87oB+URP+VLtQW9tZdU
          NvJI1BULG+GVvpc1yZZHucJutR3TwZNiWAIrNYZ/BlruADM7kO+VJy3zke5IZ/ku
          OyzYBau3zXzB6ik99KS9LwrkHMRUn7roOo+hcOAemwtQDsb89BQvrpdWGlkr48zE
          kfZtBgvJlmOBGuTQLceLC1EUh8U2ah/bTNFPNPkOYNiTCQC9RlmviRzw5wS2sAmN
          cmRCBd2H7G29JFLgPv4wPFGvbvRKBQe6RJK5OrJ0c8pcwbWid5TDIAMFWoqnlTIt
          pQIDAQAB
          -----END PUBLIC KEY-----
          EOF

      - name: Start MCP server
        shell: bash
        run: |
          uv run linkedin-mdp-mcp >server.log 2>&1 &
          echo $! > server.pid
          for i in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/8000) 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Pull and encrypt latest DMs
        run: uv run python scripts/pull_latest_dms.py

      - name: Upload encrypted DMs
        uses: actions/upload-artifact@v4
        with:
          name: latest-dms-encrypted
          path: dm-artifact/
          retention-days: 1
          if-no-files-found: error

      - name: Server log on failure
        if: failure()
        run: cat server.log || true
