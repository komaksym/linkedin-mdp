name: Temporary LinkedIn MDP Reconcile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.ORION_TOKEN }}
      LINKEDIN_API_VERSION: ${{ vars.LINKEDIN_API_VERSION || '202312' }}
      RECONCILE_ARTIFACT_KEY: ${{ secrets.RECONCILE_ARTIFACT_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Install
        run: uv sync --extra dev

      - name: Diagnose paging and fetch encrypted snapshots
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import asyncio
          import hashlib
          import json
          from urllib.parse import urlparse, parse_qs
          from linkedin_mdp_mcp.client import LinkedInMDPClient

          def flatten(payload):
              out = []
              for e in payload.get("elements", []):
                  if isinstance(e, dict) and isinstance(e.get("snapshotData"), list):
                      out.extend(e["snapshotData"])
              return out

          def element_meta(payload):
              metas = []
              for e in payload.get("elements", []):
                  if not isinstance(e, dict):
                      continue
                  meta = {}
                  for k, v in e.items():
                      if k == "snapshotData":
                          continue
                      if isinstance(v, (str, int, float, bool)) or v is None:
                          meta[k] = v
                      else:
                          meta[k] = {"type": type(v).__name__}
                  metas.append(meta)
              return metas

          def row_identity(domain, row):
              if not isinstance(row, dict):
                  return ""
              if domain == "CONNECTIONS":
                  return str(row.get("URL") or "")
              return "|".join([
                  str(row.get("Direction") or ""),
                  str(row.get("Sent At") or ""),
                  str(row.get("inviteeProfileUrl") or ""),
                  str(row.get("inviterProfileUrl") or ""),
              ])

          async def diag(client, domain):
              first = await client._get_json(
                  "/rest/memberSnapshotData",
                  {"q": "criteria", "domain": domain},
              )
              first_rows = flatten(first)
              print(f"{domain}_element_meta", json.dumps(element_meta(first), sort_keys=True))
              next_url = client._next_link(first)
              second_rows = []
              next_query = {}
              if next_url:
                  next_query = parse_qs(urlparse(next_url).query)
                  second = await client._get_json_url(next_url, None)
                  second_rows = flatten(second)
              a = {row_identity(domain, r) for r in first_rows if row_identity(domain, r)}
              b = {row_identity(domain, r) for r in second_rows if row_identity(domain, r)}
              h1 = hashlib.sha256("\n".join(sorted(a)).encode()).hexdigest()[:16]
              h2 = hashlib.sha256("\n".join(sorted(b)).encode()).hexdigest()[:16] if b else ""
              print(
                  f"{domain}_diag",
                  json.dumps({
                      "page1_rows": len(first_rows),
                      "page1_unique": len(a),
                      "page2_rows": len(second_rows),
                      "page2_unique": len(b),
                      "overlap_unique": len(a & b),
                      "page1_hash": h1,
                      "page2_hash": h2,
                      "next_query": next_query,
                  }, sort_keys=True),
              )

          async def main():
              client = LinkedInMDPClient.from_env()
              try:
                  await diag(client, "CONNECTIONS")
                  await diag(client, "INVITATIONS")
                  connections = await client.snapshot("CONNECTIONS", max_pages=50)
                  invitations = await client.snapshot("INVITATIONS", max_pages=50)
                  changelog = await client.changelog(count=50, max_pages=50)
              finally:
                  await client.aclose()

              if connections["truncated"] or invitations["truncated"]:
                  raise SystemExit("Refusing partial snapshot")

              payload = {
                  "connections": {
                      "api_version": connections["api_version"],
                      "page_count": connections["page_count"],
                      "rows": connections["rows"],
                  },
                  "invitations": {
                      "api_version": invitations["api_version"],
                      "page_count": invitations["page_count"],
                      "rows": invitations["rows"],
                  },
                  "changelog": {
                      "api_version": changelog["api_version"],
                      "page_count": changelog["page_count"],
                      "events": changelog["events"],
                      "next_start_time": changelog["next_start_time"],
                  },
              }
              with open("mdp_snapshot.json", "w", encoding="utf-8") as f:
                  json.dump(payload, f, ensure_ascii=False)

              print("connections_count=", len(connections["rows"]))
              print("invitations_count=", len(invitations["rows"]))
              print("changelog_count=", len(changelog["events"]))
              print("changelog_next_start_time=", changelog["next_start_time"])

          asyncio.run(main())
          PY

          openssl enc -aes-256-cbc -pbkdf2 -salt             -in mdp_snapshot.json             -out mdp_snapshot.json.enc             -pass env:RECONCILE_ARTIFACT_KEY
          rm -f mdp_snapshot.json

      - name: Upload encrypted snapshot
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-mdp-reconcile
          path: mdp_snapshot.json.enc
          retention-days: 1
          if-no-files-found: error
