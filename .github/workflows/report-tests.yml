name: Report Boundary E2E

on:
  pull_request:
    paths:
      - '.github/workflows/report-tests.yml'
      - '.github/workflows/morning-report.yml'
      - '.github/workflows/sync-connections.yml'
      - 'docs/google-docs-report.md'
      - 'docs/private-dm-actions.md'
      - 'src/**'
      - 'scripts/report_connections_doc.py'
      - 'scripts/build_private_dm_actions.py'
      - 'scripts/publish_private_dm_docs.py'
      - 'tests/**'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.12.18'
          python-version: '3.12'
          enable-cache: false
      - name: Install test runtime
        run: uv sync --extra dev
      - name: Verify report HTTP boundaries with synthetic data
        run: PYTHONPATH=src:. .venv/bin/python tests/e2e_doc_report.py --evidence report-evidence.json
      - name: Verify private DM Doc HTTP boundaries with synthetic data
        run: PYTHONPATH=src:. .venv/bin/python tests/e2e_private_dm_doc_report.py --evidence private-dm-doc-report-evidence.json
      - name: Verify existing reconciliation behavior
        run: .venv/bin/python -m pytest -q
