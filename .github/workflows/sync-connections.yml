name: Sync LinkedIn Connections

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-connections:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.ORION_TOKEN }}
      LINKEDIN_API_VERSION: ${{ vars.LINKEDIN_API_VERSION || '202312' }}
      SUPABASE_URL: https://mvgzdcqhdruhjoexbdqp.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Install
        run: uv sync --extra dev

      - name: Reconcile CONNECTIONS into Supabase
        run: uv run python scripts/sync_connections.py
