name: Temporary LinkedIn MDP outbound mapping

on:
  push:
    branches: [feature/connections-supabase-reconciliation]
    paths:
      - '.github/workflows/tmp-inbox-state.yml'

permissions:
  contents: read

jobs:
  map-outbound:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.ORION_TOKEN }}
      LINKEDIN_API_VERSION: ${{ vars.LINKEDIN_API_VERSION || '202312' }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Install
        run: uv sync --extra dev

      - name: Map recent outbound LinkedIn messages
        shell: bash
        run: |
          uv run python - <<'PY'
          import asyncio
          import json
          from datetime import datetime, timezone
          from linkedin_mdp_mcp.client import LinkedInMDPClient

          async def main():
              start = int(datetime(2026, 9, 29, 15, 10, tzinfo=timezone.utc).timestamp() * 1000)
              client = LinkedInMDPClient.from_env()
              try:
                  data = await client.changelog(start_time=start, count=50, max_pages=50)
              finally:
                  await client.aclose()

              rows = []
              keys = set()
              for e in data.get("events", []):
                  if not isinstance(e, dict) or e.get("resourceName") != "messages" or e.get("method") != "CREATE":
                      continue
                  a = e.get("activity")
                  if not isinstance(a, dict):
                      continue
                  keys.update(str(k) for k in a.keys())
                  owner = e.get("owner")
                  author = a.get("author")
                  if not owner or author != owner:
                      continue
                  created = a.get("createdAt")
                  if not isinstance(created, int) or created < start:
                      continue

                  content = a.get("content")
                  if not isinstance(content, str):
                      content = ""
                  rows.append({
                      "createdAt": created,
                      "thread": a.get("thread"),
                      "resourceId": e.get("resourceId"),
                      "content_preview": content[:260],
                  })

              rows.sort(key=lambda x: x["createdAt"])
              print("OUTBOUND_ACTIVITY_KEYS=" + json.dumps(sorted(keys)))
              print("OUTBOUND_ROWS=" + json.dumps(rows, ensure_ascii=False, sort_keys=True))

          asyncio.run(main())
          PY
