name: Temporary LinkedIn INBOX state pull

on:
  push:
    branches: [feature/connections-supabase-reconciliation]
    paths:
      - '.github/workflows/tmp-inbox-state.yml'

permissions:
  contents: read

jobs:
  pull-inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.ORION_TOKEN }}
      LINKEDIN_API_VERSION: ${{ vars.LINKEDIN_API_VERSION || '202312' }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Install
        run: uv sync --extra dev

      - name: Pull recent LinkedIn INBOX metadata
        shell: bash
        run: |
          uv run python - <<'PY'
          import asyncio
          import json
          from collections import Counter
          from linkedin_mdp_mcp.client import LinkedInMDPClient

          async def main():
              client = LinkedInMDPClient.from_env()
              try:
                  snap = await client.snapshot("INBOX", max_pages=50)
              finally:
                  await client.aclose()

              rows = [r for r in snap.get("rows", []) if isinstance(r, dict)]
              print("INBOX_TOTAL=" + str(len(rows)))
              print("INBOX_TRUNCATED=" + str(snap.get("truncated")))
              print("FOLDER_COUNTS=" + json.dumps(Counter(str(r.get("FOLDER")) for r in rows), sort_keys=True))

              sentish = [r for r in rows if "sent" in str(r.get("FOLDER", "")).lower()]
              selected = sentish[:100] if sentish else rows[:40]

              out = []
              for r in selected:
                  out.append({
                      "DATE": r.get("DATE"),
                      "FOLDER": r.get("FOLDER"),
                      "FROM": r.get("FROM"),
                      "TO": r.get("TO"),
                      "SENDER PROFILE URL": r.get("SENDER PROFILE URL"),
                      "RECIPIENT PROFILE URLS": r.get("RECIPIENT PROFILE URLS"),
                      "CONVERSATION ID": r.get("CONVERSATION ID"),
                      "CONVERSATION TITLE": r.get("CONVERSATION TITLE"),
                      "CONTENT_PREVIEW": (str(r.get("CONTENT") or "")[:180]),
                  })

              print("RECENT_SENT_ROWS=" + json.dumps(out, ensure_ascii=False, sort_keys=True))

          asyncio.run(main())
          PY
