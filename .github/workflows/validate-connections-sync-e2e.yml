name: Validate CONNECTIONS Sync E2E

on:
  push:
    branches:
      - feature/connections-supabase-reconciliation
    paths:
      - '.github/workflows/validate-connections-sync-e2e.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.ORION_TOKEN }}
      LINKEDIN_API_VERSION: ${{ vars.LINKEDIN_API_VERSION || '202312' }}
      SUPABASE_URL: https://mvgzdcqhdruhjoexbdqp.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Install
        run: uv sync --extra dev

      - name: Diagnose CONNECTIONS pagination safely
        shell: bash
        run: |
          uv run python - <<'PY'
          import asyncio
          import hashlib
          import json

          from linkedin_mdp_mcp.client import LinkedInMDPClient
          from linkedin_mdp_mcp.connection_sync import normalize_linkedin_url


          async def main() -> None:
              client = LinkedInMDPClient.from_env()
              try:
                  url = client._make_url("/rest/memberSnapshotData")
                  query = {"q": "criteria", "domain": "CONNECTIONS"}
                  seen_urls: set[str] = set()
                  seen_row_hashes: set[str] = set()
                  page_summaries = []

                  for page_number in range(1, 51):
                      payload = await client._get_json_url(url, query)
                      rows = []
                      for element in payload.get("elements", []):
                          if isinstance(element, dict):
                              data = element.get("snapshotData")
                              if isinstance(data, list):
                                  rows.extend(data)

                      row_hashes = {
                          hashlib.sha256(
                              json.dumps(row, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
                          ).hexdigest()
                          for row in rows
                          if isinstance(row, dict)
                      }
                      element_metadata = []
                      for element in payload.get("elements", []):
                          if not isinstance(element, dict):
                              continue
                          safe = {}
                          for key, value in element.items():
                              if key == "snapshotData":
                                  continue
                              if key == "snapshotDomain":
                                  safe[key] = value
                              elif any(token in key.lower() for token in ("time", "date", "created", "generated", "updated")) and isinstance(value, (int, float, str)):
                                  safe[key] = value
                              else:
                                  safe[key] = type(value).__name__
                          element_metadata.append(safe)

                      normalized_urls = [
                          normalized
                          for row in rows
                          if isinstance(row, dict)
                          for normalized in [normalize_linkedin_url(row.get("URL"))]
                          if normalized is not None
                      ]
                      unique_page_urls = set(normalized_urls)
                      paging = payload.get("paging")
                      if not isinstance(paging, dict):
                          paging = {}

                      page_summaries.append(
                          {
                              "page": page_number,
                              "rows": len(rows),
                              "valid_urls": len(normalized_urls),
                              "unique_urls": len(unique_page_urls),
                              "duplicates_within_page": len(normalized_urls) - len(unique_page_urls),
                              "overlap_with_previous_pages": len(unique_page_urls & seen_urls),
                              "unique_exact_rows": len(row_hashes),
                              "exact_row_overlap_with_previous_pages": len(row_hashes & seen_row_hashes),
                              "elements": len(payload.get("elements", [])) if isinstance(payload.get("elements"), list) else None,
                              "element_metadata": element_metadata,
                              "paging_start": paging.get("start"),
                              "paging_count": paging.get("count"),
                              "paging_total": paging.get("total"),
                          }
                      )
                      seen_urls.update(unique_page_urls)
                      seen_row_hashes.update(row_hashes)

                      next_url = client._next_link(payload)
                      if next_url is None:
                          break
                      url = next_url
                      query = None
                  else:
                      raise RuntimeError("CONNECTIONS pagination exceeded 50 pages")

                  print(
                      json.dumps(
                          {
                              "page_count": len(page_summaries),
                              "pages": page_summaries,
                              "total_rows": sum(page["rows"] for page in page_summaries),
                              "total_unique_urls": len(seen_urls),
                          },
                          sort_keys=True,
                      )
                  )
              finally:
                  await client.aclose()


          asyncio.run(main())
          PY

      - name: Reconcile first pass
        shell: bash
        run: |
          set -o pipefail
          uv run python scripts/sync_connections.py | tee run1.json

      - name: Reconcile immediate second pass
        shell: bash
        run: |
          set -o pipefail
          uv run python scripts/sync_connections.py | tee run2.json

      - name: Assert replay is idempotent
        shell: bash
        run: |
          python - <<'PY'
          import json

          with open("run1.json", encoding="utf-8") as f:
              first = json.load(f)
          with open("run2.json", encoding="utf-8") as f:
              second = json.load(f)

          assert first["fetched"] > 0
          assert first["fetched"] == first["matched"] + first["unmatched"]
          assert second["fetched"] == first["fetched"]
          assert second["matched"] == first["matched"]
          assert second["unmatched"] == first["unmatched"]
          assert second["inserted"] == 0
          print("idempotency_verified=true")
          PY

      - name: Upload aggregate validation counts
        uses: actions/upload-artifact@v4
        with:
          name: connection-sync-e2e-summary
          path: |
            run1.json
            run2.json
          retention-days: 1
          if-no-files-found: error
