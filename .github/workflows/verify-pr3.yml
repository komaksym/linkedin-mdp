name: Verify PR 3

on:
  push:
    branches: [fix/snapshot-pagination-order]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.ORION_TOKEN }}
      LINKEDIN_API_VERSION: ${{ vars.LINKEDIN_API_VERSION || '202312' }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: '3.12'

      - name: Narrow client regression
        run: |
          uv sync --extra dev
          uv run pytest -q tests/test_client.py

      - name: Full test suite
        run: uv run pytest -q

      - name: Build package
        run: uv build

      - name: Prove project verification skill
        shell: bash
        run: |
          state="${RUNNER_TEMP}/linkedin-mdp-verify"
          cleanup() {
            ./.agents/skills/verify/scripts/verify.sh cleanup "$state" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ./.agents/skills/verify/scripts/verify.sh launch "$state"
          ./.agents/skills/verify/scripts/verify.sh doctor "$state"
          ./.agents/skills/verify/scripts/verify.sh drive "$state"
          ./.agents/skills/verify/scripts/verify.sh cleanup "$state"
          trap - EXIT

          test -f "$state.evidence/e2e-summary.json"
          cp "$state.evidence/e2e-summary.json" pr3-verification-summary.json

      - name: Upload verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr3-verification-summary
          path: pr3-verification-summary.json
          retention-days: 7
          if-no-files-found: error
