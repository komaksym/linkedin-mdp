name: Verify snapshot pagination fix

on:
  push:
    branches:
      - fix/snapshot-pagination-order

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.ORION_TOKEN }}
      LINKEDIN_API_VERSION: ${{ vars.LINKEDIN_API_VERSION || '202312' }}
      MCP_HOST: 127.0.0.1
      MCP_PORT: '8000'

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Install
        run: uv sync --extra dev

      - name: Client regression tests
        run: uv run pytest tests/test_client.py -q

      - name: Full test suite
        run: uv run pytest -q

      - name: Build
        run: uv build

      - name: Start MCP server
        shell: bash
        run: |
          uv run linkedin-mdp-mcp >server.log 2>&1 &
          echo $! > server.pid
          for i in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/8000) 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Live MCP E2E
        run: uv run python tests/e2e_live.py

      - name: Upload E2E summary
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-pagination-e2e-summary
          path: e2e-summary.json
          retention-days: 7
          if-no-files-found: error

      - name: Server log on failure
        if: failure()
        run: cat server.log || true
