[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "linkedin-mdp-mcp"
version = "0.1.0"
description = "Minimal read-only MCP bridge for LinkedIn Member Data Portability"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "mcp>=2,<3",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[dependency-groups]
sync = ["httpx>=0.28,<1"]

[project.scripts]
linkedin-mdp-mcp = "linkedin_mdp_mcp.server:main"
linkedin-mdp-smoke = "linkedin_mdp_mcp.smoke:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/linkedin_mdp_mcp"]
